<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Plein — Informations légales</title>
<style>
:root{--accent:#FF5C00;--ink:#1a1a1a;--muted:#666;--line:#ececec}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.65;background:#fff}
.wrap{max-width:760px;margin:0 auto;padding:48px 22px 80px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo .dot{color:var(--accent)}
h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:28px 0 10px}
.lead{font-size:17px;color:#333}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Plein<span class="dot">.</span></div>
  <h1>Informations légales</h1>
  <p class="lead">Documents relatifs à l'application mobile Plein — suivi des dépenses de carburant et d'entretien de véhicules.</p>
  <div class="btns">
    <a class="btn" href="/privacy/">Politique de confidentialité</a>
    <a class="btn alt" href="/terms/">Conditions d'utilisation</a>
  </div>
  <footer>
    Contact : <a href="mailto:enis.1789@gmail.com">enis.1789@gmail.com</a>
  </footer>
</div>
</body>
</html>
